<div class="space-y-6">
  <div class="flex justify-between"><div><h1 class="font-headline-md text-on-surface dark:text-stone-200">Recetas</h1><p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">{{ recipes().length }} recetas</p></div><button (click)="openCreate()" class="px-4 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm active:scale-95 flex items-center gap-2"><span class="material-symbols-outlined text-lg">add</span> Nuevo</button></div>

  @if (showForm) {
    <div class="bg-white dark:bg-stone-900 rounded-2xl border dark:border-stone-800 p-6">
      <h2 class="font-headline-sm mb-4">{{ editingId() ? 'Editar' : 'Nueva' }} receta</h2>
      <form (ngSubmit)="save()" [formGroup]="form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="font-label-sm block mb-1">Título *</label><input formControlName="title" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div><label class="font-label-sm block mb-1">Imagen URL</label><input formControlName="imageUrl" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div class="md:col-span-2"><label class="font-label-sm block mb-1">Descripción</label><textarea formControlName="description" rows="2" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"></textarea></div>
          <div><label class="font-label-sm block mb-1">Tiempo (min)</label><input formControlName="prepTimeMin" type="number" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div><label class="font-label-sm block mb-1">Dificultad</label><select formControlName="difficulty" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"><option>Fácil</option><option>Media</option><option>Difícil</option></select></div>
          <div><label class="font-label-sm block mb-1">Costo</label><select formControlName="budgetTag" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"><option value="bajo">Bajo</option><option value="medio">Medio</option><option value="alto">Alto</option></select></div>
          <div><label class="font-label-sm block mb-1">Horario</label><select formControlName="mealType" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"><option value="">-</option><option value="desayuno">Desayuno</option><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option></select></div>
          <div><label class="font-label-sm block mb-1">Calorías</label><input formControlName="calories" type="number" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div><label class="font-label-sm block mb-1">Proteína (g)</label><input formControlName="proteinG" type="number" step="0.1" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div><label class="font-label-sm block mb-1">Carbos (g)</label><input formControlName="carbsG" type="number" step="0.1" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div><label class="font-label-sm block mb-1">Grasas (g)</label><input formControlName="fatG" type="number" step="0.1" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
          <div class="md:col-span-2"><label class="font-label-sm block mb-1">Objetivos (slugs separados por coma)</label><input formControlName="goalTags" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" placeholder="bajar-peso,energia-diaria" /></div>
          <div class="md:col-span-2"><label class="font-label-sm block mb-1">Preparación</label><textarea formControlName="instructions" rows="3" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"></textarea></div>
        </div>
        <div class="flex gap-3 pt-2"><button type="submit" [disabled]="loading" class="px-6 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm">{{ loading ? 'Guardando...' : 'Guardar' }}</button><button type="button" (click)="showForm = false" class="px-6 py-2.5 bg-stone-100 dark:bg-stone-800 rounded-xl font-label-sm">Cancelar</button></div>
      </form>
    </div>
  }

  <div class="bg-white dark:bg-stone-900 rounded-2xl border dark:border-stone-800 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-stone-50 dark:bg-stone-800 text-on-surface-variant dark:text-stone-400 font-label-sm uppercase tracking-wider">
        <tr><th class="text-left px-4 py-3">Título</th><th class="text-left px-4 py-3 hidden md:table-cell">Tiempo</th><th class="text-left px-4 py-3 hidden md:table-cell">Costo</th><th class="text-right px-4 py-3">Acciones</th></tr>
      </thead>
      <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
        @for (r of recipes(); track r.id) {
          <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/50">
            <td class="px-4 py-3 font-label-lg text-on-surface dark:text-stone-200">{{ r.title }}</td>
            <td class="px-4 py-3 hidden md:table-cell text-on-surface-variant dark:text-stone-400">{{ r.prepTimeMin }} min</td>
            <td class="px-4 py-3 hidden md:table-cell text-on-surface-variant dark:text-stone-400">{{ r.budgetTag }}</td>
            <td class="px-4 py-3 text-right">
              <button (click)="editRecipe(r)" class="p-2 hover:bg-stone-100 dark:hover:bg-stone-700 rounded-lg"><span class="material-symbols-outlined text-sm">edit</span></button>
              <button (click)="deleteRecipe(r.id)" class="p-2 hover:bg-red-50 dark:hover:bg-red-950/20 rounded-lg"><span class="material-symbols-outlined text-sm text-error">delete</span></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
