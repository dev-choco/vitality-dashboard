<div class="space-y-6">
  <div>
    <h1 class="font-headline-md text-on-surface dark:text-stone-200">Dashboard</h1>
    <p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Panel de control de Vitality</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <a routerLink="/alimentos" class="bg-white dark:bg-stone-900 rounded-2xl p-6 border border-stone-200 dark:border-stone-800 hover:shadow-lg hover:border-primary/30 transition-all">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
          <span class="material-symbols-outlined text-primary">egg_alt</span>
        </div>
        <p class="font-label-lg text-on-surface dark:text-stone-200">Alimentos</p>
      </div>
      <p class="font-headline-lg text-primary">{{ foodCount() }}</p>
      <p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Registros totales</p>
    </a>

    <a routerLink="/categorias" class="bg-white dark:bg-stone-900 rounded-2xl p-6 border border-stone-200 dark:border-stone-800 hover:shadow-lg hover:border-primary/30 transition-all">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-tertiary/10 flex items-center justify-center">
          <span class="material-symbols-outlined text-tertiary">category</span>
        </div>
        <p class="font-label-lg text-on-surface dark:text-stone-200">Categorías</p>
      </div>
      <p class="font-headline-lg text-tertiary">{{ categoryCount() }}</p>
      <p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Grupos de alimentos</p>
    </a>

    <a routerLink="/recetas" class="bg-white dark:bg-stone-900 rounded-2xl p-6 border border-stone-200 dark:border-stone-800 hover:shadow-lg hover:border-primary/30 transition-all">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-green-100 dark:bg-green-900/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-green-700 dark:text-green-400">menu_book</span>
        </div>
        <p class="font-label-lg text-on-surface dark:text-stone-200">Recetas</p>
      </div>
      <p class="font-headline-lg text-green-700 dark:text-green-400">{{ recipeCount() }}</p>
      <p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Total</p>
    </a>

    <a routerLink="/mitos" class="bg-white dark:bg-stone-900 rounded-2xl p-6 border border-stone-200 dark:border-stone-800 hover:shadow-lg hover:border-primary/30 transition-all">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-red-50 dark:bg-red-950/20 flex items-center justify-center">
          <span class="material-symbols-outlined text-red-500">fact_check</span>
        </div>
        <p class="font-label-lg text-on-surface dark:text-stone-200">Mitos</p>
      </div>
      <p class="font-headline-lg text-red-500">{{ mythCount() }}</p>
      <p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Mitos y realidades</p>
    </a>
  </div>
</div>
