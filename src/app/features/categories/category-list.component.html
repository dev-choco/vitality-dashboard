<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div><h1 class="font-headline-md text-on-surface dark:text-stone-200">Categorías</h1><p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Grupos de alimentos</p></div>
    <button (click)="openCreate()" class="px-4 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm active:scale-95 flex items-center gap-2"><span class="material-symbols-outlined text-lg">add</span> Nuevo</button>
  </div>

  @if (showForm) {
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 p-6 max-w-md">
      <h2 class="font-headline-sm text-on-surface dark:text-stone-200 mb-4">{{ editingId() ? 'Editar' : 'Nueva' }} categoría</h2>
      <form (ngSubmit)="save()" [formGroup]="form" class="space-y-4">
        <div><label class="font-label-sm block mb-1">Nombre *</label><input formControlName="name" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
        <div><label class="font-label-sm block mb-1">Ícono Material *</label><input formControlName="icon" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" placeholder="egg_alt, grain, eco..." /></div>
        <div class="flex gap-3 pt-2"><button type="submit" [disabled]="loading" class="px-6 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm">{{ loading ? 'Guardando...' : 'Guardar' }}</button><button type="button" (click)="showForm = false" class="px-6 py-2.5 bg-stone-100 dark:bg-stone-800 rounded-xl font-label-sm">Cancelar</button></div>
      </form>
    </div>
  }

  <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-800 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-stone-50 dark:bg-stone-800 text-on-surface-variant dark:text-stone-400 font-label-sm uppercase tracking-wider">
        <tr><th class="text-left px-4 py-3">Nombre</th><th class="text-left px-4 py-3">Slug</th><th class="text-left px-4 py-3">Ícono</th><th class="text-right px-4 py-3">Acciones</th></tr>
      </thead>
      <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
        @for (c of categories(); track c.id) {
          <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/50">
            <td class="px-4 py-3 font-label-lg text-on-surface dark:text-stone-200">{{ c.name }}</td>
            <td class="px-4 py-3 text-on-surface-variant dark:text-stone-400">{{ c.slug }}</td>
            <td class="px-4 py-3"><span class="material-symbols-outlined text-on-surface-variant dark:text-stone-400">{{ c.icon }}</span></td>
            <td class="px-4 py-3 text-right">
              <button (click)="editCategory(c)" class="p-2 hover:bg-stone-100 dark:hover:bg-stone-700 rounded-lg"><span class="material-symbols-outlined text-sm">edit</span></button>
              <button (click)="deleteCategory(c.id)" class="p-2 hover:bg-red-50 dark:hover:bg-red-950/20 rounded-lg"><span class="material-symbols-outlined text-sm text-error">delete</span></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
