<div class="space-y-6">
  <div class="flex justify-between"><div><h1 class="font-headline-md text-on-surface dark:text-stone-200">Objetivos</h1><p class="font-body-sm text-on-surface-variant dark:text-stone-400 mt-1">Metas de recetas</p></div><button (click)="openCreate()" class="px-4 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm active:scale-95 flex items-center gap-2"><span class="material-symbols-outlined text-lg">add</span> Nuevo</button></div>

  @if (showForm) {
    <div class="bg-white dark:bg-stone-900 rounded-2xl border dark:border-stone-800 p-6 max-w-md">
      <h2 class="font-headline-sm mb-4">{{ editingId() ? 'Editar' : 'Nuevo' }} objetivo</h2>
      <form (ngSubmit)="save()" [formGroup]="form" class="space-y-4">
        <div><label class="font-label-sm block mb-1">Nombre *</label><input formControlName="name" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
        <div><label class="font-label-sm block mb-1">Slug *</label><input formControlName="slug" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" placeholder="bajar-peso" /></div>
        <div><label class="font-label-sm block mb-1">Ícono</label><input formControlName="icon" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none" /></div>
        <div><label class="font-label-sm block mb-1">Descripción</label><textarea formControlName="description" rows="2" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"></textarea></div>
        <div><label class="font-label-sm block mb-1">Color</label><select formControlName="colorClass" class="w-full px-3 py-2 rounded-lg border dark:border-stone-700 bg-white dark:bg-stone-800 text-sm dark:text-stone-200 focus:ring-2 focus:ring-primary outline-none"><option value="primary">Verde</option><option value="secondary">Arena</option><option value="tertiary">Terracota</option></select></div>
        <div class="flex gap-3 pt-2"><button type="submit" [disabled]="loading" class="px-6 py-2.5 bg-primary text-on-primary rounded-xl font-label-sm">{{ loading ? 'Guardando...' : 'Guardar' }}</button><button type="button" (click)="showForm = false" class="px-6 py-2.5 bg-stone-100 dark:bg-stone-800 rounded-xl font-label-sm">Cancelar</button></div>
      </form>
    </div>
  }

  <div class="bg-white dark:bg-stone-900 rounded-2xl border dark:border-stone-800 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-stone-50 dark:bg-stone-800 text-on-surface-variant dark:text-stone-400 font-label-sm uppercase tracking-wider">
        <tr><th class="text-left px-4 py-3">Nombre</th><th class="text-left px-4 py-3">Slug</th><th class="text-left px-4 py-3 hidden md:table-cell">Ícono</th><th class="text-right px-4 py-3">Acciones</th></tr>
      </thead>
      <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
        @for (g of goals(); track g.id) {
          <tr class="hover:bg-stone-50 dark:hover:bg-stone-800/50">
            <td class="px-4 py-3 font-label-lg text-on-surface dark:text-stone-200">{{ g.name }}</td>
            <td class="px-4 py-3 text-on-surface-variant dark:text-stone-400 text-xs font-mono">{{ g.slug }}</td>
            <td class="px-4 py-3 hidden md:table-cell"><span class="material-symbols-outlined text-on-surface-variant dark:text-stone-400">{{ g.icon }}</span></td>
            <td class="px-4 py-3 text-right">
              <button (click)="editGoal(g)" class="p-2 hover:bg-stone-100 dark:hover:bg-stone-700 rounded-lg"><span class="material-symbols-outlined text-sm">edit</span></button>
              <button (click)="deleteGoal(g.id!)" class="p-2 hover:bg-red-50 dark:hover:bg-red-950/20 rounded-lg"><span class="material-symbols-outlined text-sm text-error">delete</span></button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
