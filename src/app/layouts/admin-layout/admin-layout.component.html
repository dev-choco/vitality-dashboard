<div class="min-h-screen flex bg-stone-50 dark:bg-stone-950">
  <!-- Sidebar -->
  <aside class="w-60 bg-stone-900 dark:bg-stone-950 border-r border-stone-800 flex flex-col shrink-0" [class.w-16]="menuCollapsed">
    <div class="h-16 flex items-center px-4 border-b border-stone-800">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-sm text-on-primary">admin_panel_settings</span>
      </div>
      @if (!menuCollapsed) {
        <span class="ml-3 font-lexend font-bold text-white text-sm">Vitality Admin</span>
      }
    </div>

    <nav class="flex-1 py-4 px-2 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary/20 text-primary"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-400 hover:text-white hover:bg-stone-800 transition-colors text-sm font-medium"
        >
          <span class="material-symbols-outlined text-xl shrink-0">{{ item.icon }}</span>
          @if (!menuCollapsed) { {{ item.label }} }
        </a>
      }
    </nav>

    <div class="p-2 border-t border-stone-800">
      <a routerLink="/perfil" routerLinkActive="bg-primary/20 text-primary"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-400 hover:text-white hover:bg-stone-800 transition-colors text-sm font-medium mb-1">
        <span class="material-symbols-outlined text-xl shrink-0">person</span>
        @if (!menuCollapsed) { Perfil }
      </a>
      <button (click)="logout()"
              class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-stone-400 hover:text-red-400 hover:bg-red-950/20 transition-colors text-sm font-medium w-full">
        <span class="material-symbols-outlined text-xl shrink-0">logout</span>
        @if (!menuCollapsed) { Cerrar sesión }
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-stone-900 border-b border-stone-200 dark:border-stone-800 flex items-center justify-between px-6 shrink-0">
      <button (click)="menuCollapsed = !menuCollapsed" class="p-2 hover:bg-stone-100 dark:hover:bg-stone-800 rounded-lg transition-colors">
        <span class="material-symbols-outlined text-stone-500">{{ menuCollapsed ? 'menu_open' : 'menu' }}</span>
      </button>
      <div class="flex items-center gap-3">
        <span class="font-body-sm text-on-surface-variant dark:text-stone-400">{{ user()?.name }}</span>
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-sm text-on-primary">person</span>
        </div>
      </div>
    </header>
    <main class="flex-1 p-6 overflow-auto">
      <router-outlet />
    </main>
  </div>
</div>
