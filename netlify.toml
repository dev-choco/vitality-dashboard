[build]
  command = "npm run generate-config && npm run build"
  publish = "dist/vitality-dashboard/browser"

[[redirects]]
  from = "/vitality-api/*"
  to = "https://vitality-api.onrender.com/vitality-api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  API_URL = "http://localhost:9000/vitality-api/v1"
